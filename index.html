<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Game Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      background: #333; 
      font-family: Arial, sans-serif; 
    }
    #menu-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      text-align: center;
      width: 100%;
      padding: 20px;
    }
    h1 {
      color: #fff;
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    #buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }
    .menu-btn {
      height: 120px;
      font-size: 28px;
      font-weight: bold;
      border: 3px solid #fff;
      border-radius: 15px;
      color: #fff;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 0.1s, opacity 0.1s;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .menu-btn:active {
      transform: scale(0.95);
      opacity: 0.8;
    }
    .menu-btn:hover {
      opacity: 0.9;
    }
    #run-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    #snake-btn {
      background: linear-gradient(135deg, #FF6B6B 0%, #FF8E72 100%);
    }
    #time-btn {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }
  </style>
</head>
<body>
  <div id="menu-container">
    <h1>GAMES</h1>
    <div id="buttons">
      <a href="run.html" id="run-btn" class="menu-btn">RUN</a>
      <a href="snake.html" id="snake-btn" class="menu-btn">SNAKE</a>
      <a href="time.html" id="time-btn" class="menu-btn">TIME</a>
    </div>
  </div>
</body>
</html>
