<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Time Consumers</title>
<link rel="stylesheet" href="styles.css">
<div id="game-wrapper">
  <div id="top-space"></div>
  <a href="index.html" id="back-btn">← MENU</a>
  <div id="overlay">
    <div class="overlay-content">
      <h2>TIME CONSUMERS</h2>
      <div class="controls-section">
        <h3>Mobile</h3>
        <p>Tap left button to move left</p>
        <p>Tap right button to move right</p>
        <p>Tap screen to shoot</p>
      </div>
      <div class="controls-section">
        <h3>Keyboard</h3>
        <p>← → Arrow Keys to move</p>
        <p>Space to shoot</p>
        <p>R to restart</p>
      </div>
    </div>
    <button id="start-btn">START GAME</button>
  </div>
  <div id="canvas-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>
  <div id="bottom-space"></div>
  <div id="run-controls">
    <button id="left-btn" class="btn">LEFT</button>
    <button id="right-btn" class="btn">RIGHT</button>
  </div>
</div>
<div id="stats">
  <div id="scoreDisplay">0</div>
  <div id="statusDisplay"></div>
</div>
<script>
// ===== 1. CONSTANTS & CONFIGURATION =====
const CANVAS_WIDTH = 800;
const CANVAS_HEIGHT = 600;

const PLAYER_WIDTH = 60;
const PLAYER_HEIGHT = 30;
const PLAYER_START_X = 370;
const PLAYER_START_Y = 540;

const BULLET_WIDTH = 10;
const BULLET_HEIGHT = 10;
const BULLET_SPEED = 0.4;

const ENEMY_WIDTH = 60;
const ENEMY_HEIGHT = 30;
const ENEMY_INITIAL_SPEED = 0.5;
const ENEMY_ACCELERATION = 0.15;

const GRID_COLS = 8;
const GRID_ROWS = 5;
const SCREEN_EDGE_LEFT = 0.2;
const SCREEN_EDGE_RIGHT = 0.8;
const WAITTIME_AFTER_EDGE = 4;
const POINTS_PER_KILL = 10;

// ===== 2. UI ELEMENTS & DOM REFERENCES =====
const canvasElement = document.getElementById('gameCanvas');
const canvasContext = canvasElement.getContext('2d');
const startButton = document.getElementById('start-btn');
const overlayElement = document.getElementById('overlay');
const scoreDisplay = document.getElementById('scoreDisplay');
const statusDisplay = document.getElementById('statusDisplay');
const leftButton = document.getElementById('left-btn');
const rightButton = document.getElementById('right-btn');
const controlsElement = document.getElementById('run-controls');

// ===== 3. GAME STATE =====
let playerObject = {};
let bulletsArray = [];
let enemiesArray = [];
let enemyDirection = 1;
let enemySpeed = ENEMY_INITIAL_SPEED;
let waitTime = 0;
let playerScore = 0;
let isGameOver = false;
let gameStarted = false;
let lastTimestamp = 0;
let keysPressed = {};
let leftPressed = false;
let rightPressed = false;

// ===== 4. RENDERING SYSTEM =====
function drawBackground() {
  canvasElement.width = CANVAS_WIDTH;
  canvasElement.height = CANVAS_HEIGHT;
}

function drawPlayer() {
  canvasContext.fillStyle = '#ef4444';
  canvasContext.fillRect(playerObject.x, playerObject.y, PLAYER_WIDTH, PLAYER_HEIGHT);
}

function drawEnemies() {
  canvasContext.fillStyle = '#ef4444';
  for (let enemy of enemiesArray) {
    if (enemy.isActive) {
      canvasContext.fillRect(enemy.x, enemy.y, ENEMY_WIDTH, ENEMY_HEIGHT);
    }
  }
}

function drawBullets() {
  canvasContext.fillStyle = '#fbbf24';
  for (let bullet of bulletsArray) {
    canvasContext.fillRect(bullet.x, bullet.y, BULLET_WIDTH, BULLET_HEIGHT);
  }
}

function drawGameOver() {
  canvasContext.fillStyle = 'rgba(0,0,0,0.7)';
  canvasContext.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
  
  canvasContext.fillStyle = '#ef4444';
  canvasContext.font = 'bold 60px Arial';
  canvasContext.textAlign = 'center';
  canvasContext.fillText('GAME OVER!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 40);
  
  canvasContext.fillStyle = '#FFF';
  canvasContext.font = '20px Arial';
  canvasContext.fillText('Press R to Restart', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 20);
  
  canvasContext.fillStyle = '#fbbf24';
  canvasContext.fillRect(CANVAS_WIDTH / 2 - 100, CANVAS_HEIGHT / 2 + 50, 200, 60);
  canvasContext.strokeStyle = '#FFF';
  canvasContext.lineWidth = 3;
  canvasContext.strokeRect(CANVAS_WIDTH / 2 - 100, CANVAS_HEIGHT / 2 + 50, 200, 60);
  canvasContext.fillStyle = '#FFF';
  canvasContext.font = 'bold 24px Arial';
  canvasContext.fillText('RESTART', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 88);
}

function renderFrame() {
  drawBackground();
  drawPlayer();
  drawEnemies();
  drawBullets();
  if (isGameOver) {
    drawGameOver();
  }
}

function updateHUD(score, message) {
  scoreDisplay.innerHTML = score;
  statusDisplay.innerHTML = message;
}

// ===== 5. MOVEMENT & PHYSICS SYSTEM =====
function updatePlayerMovement(deltaTime) {
  const movementSpeed = 0.36 * deltaTime;
  
  if (leftPressed || keysPressed['ArrowLeft']) {
    playerObject.x -= movementSpeed;
  }
  if (rightPressed || keysPressed['ArrowRight']) {
    playerObject.x += movementSpeed;
  }
  
  // Clamp player to bounds
  playerObject.x = Math.max(0, Math.min(CANVAS_WIDTH - PLAYER_WIDTH, playerObject.x));
}

function updateBulletMovement(deltaTime) {
  for (let i = bulletsArray.length - 1; i >= 0; i--) {
    bulletsArray[i].y -= BULLET_SPEED * deltaTime;
    if (bulletsArray[i].y < -10) {
      bulletsArray.splice(i, 1);
    }
  }
}

function updateEnemyMovement(deltaTime) {
  const activeEnemies = enemiesArray.filter(e => e.isActive);
  if (activeEnemies.length === 0) return;
  
  const enemyMovementSpeed = enemySpeed * 0.19 * deltaTime;
  
  if (waitTime > 0) {
    // Moving down after edge hit
    const moveAmount = Math.min(waitTime, enemyMovementSpeed);
    activeEnemies.forEach(e => e.y += moveAmount);
    waitTime -= moveAmount;
    if (waitTime <= 0) {
      enemySpeed += ENEMY_ACCELERATION;
    }
  } else {
    // Moving horizontally
    activeEnemies.forEach(e => e.x += enemyDirection * enemyMovementSpeed);
    
    // Check edge collision
    const minX = Math.min(...activeEnemies.map(e => e.x));
    const maxX = Math.max(...activeEnemies.map(e => e.x + ENEMY_WIDTH));
    
    if (minX < 0) {
      activeEnemies.forEach(e => e.x -= minX);
      waitTime = WAITTIME_AFTER_EDGE;
      enemyDirection = 1;
    } else if (maxX > CANVAS_WIDTH) {
      activeEnemies.forEach(e => e.x += CANVAS_WIDTH - maxX);
      waitTime = WAITTIME_AFTER_EDGE;
      enemyDirection = -1;
    }
  }
}

// ===== 6. GAME CONDITIONS & COLLISION =====
function isRectColliding(rect1, w1, h1, rect2, w2, h2) {
  return rect1.x < rect2.x + w2 &&
         rect1.x + w1 > rect2.x &&
         rect1.y < rect2.y + h2 &&
         rect1.y + h1 > rect2.y;
}

function checkBulletEnemyCollisions() {
  for (let bulletIdx = bulletsArray.length - 1; bulletIdx >= 0; bulletIdx--) {
    const bullet = bulletsArray[bulletIdx];
    
    for (let enemyIdx = enemiesArray.length - 1; enemyIdx >= 0; enemyIdx--) {
      const enemy = enemiesArray[enemyIdx];
      
      if (enemy.isActive && isRectColliding(bullet, BULLET_WIDTH, BULLET_HEIGHT, enemy, ENEMY_WIDTH, ENEMY_HEIGHT)) {
        enemy.isActive = false;
        bulletsArray.splice(bulletIdx, 1);
        playerScore += POINTS_PER_KILL;
        updateHUD(playerScore, '');
        break;
      }
    }
  }
}

function checkEndConditions() {
  const activeEnemies = enemiesArray.filter(e => e.isActive);
  
  if (activeEnemies.length === 0) {
    isGameOver = true;
    return;
  }
  
  for (let enemy of activeEnemies) {
    if (enemy.y + ENEMY_HEIGHT >= playerObject.y) {
      isGameOver = true;
      return;
    }
  }
}

// ===== 7. GAME LOGIC & INITIALIZATION =====
function spawnEnemyWave() {
  enemiesArray = [];
  for (let i = 0; i < GRID_COLS * GRID_ROWS; i++) {
    enemiesArray.push({
      x: 64 + (i % GRID_COLS) * 84,
      y: 50 + Math.floor(i / GRID_COLS) * 54,
      isActive: true
    });
  }
}

function resetGameState() {
  playerObject = { x: PLAYER_START_X, y: PLAYER_START_Y };
  bulletsArray = [];
  enemyDirection = 1;
  enemySpeed = ENEMY_INITIAL_SPEED;
  waitTime = 0;
  playerScore = 0;
  isGameOver = false;
  lastTimestamp = 0;
  spawnEnemyWave();
  updateHUD(playerScore, 'Tap buttons to move, tap screen to shoot');
}

function initializeGame() {
  gameStarted = true;
  overlayElement.classList.add('hidden');
  controlsElement.classList.add('show');
  resetGameState();
}

function updateGameLogic(deltaTime) {
  if (isGameOver) return;
  
  updatePlayerMovement(deltaTime);
  updateBulletMovement(deltaTime);
  updateEnemyMovement(deltaTime);
  checkBulletEnemyCollisions();
  checkEndConditions();
}

// ===== 8. CONTROLS SYSTEM =====
function shootBullet() {
  bulletsArray.push({ x: playerObject.x + 30, y: playerObject.y - PLAYER_HEIGHT });
}

function isOnRestartButton(x, y) {
  const bx = CANVAS_WIDTH / 2, by = CANVAS_HEIGHT / 2 + 80, bw = 100, bh = 30;
  return x >= bx - bw && x <= bx + bw && y >= by - bh && y <= by + bh;
}

function getCanvasCoordinates(clientX, clientY) {
  const rect = canvasElement.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (CANVAS_WIDTH / rect.width),
    y: (clientY - rect.top) * (CANVAS_HEIGHT / rect.height)
  };
}

function handleTouchStart(touchEvent) {
  if (!gameStarted || isGameOver) return;
  shootBullet();
}

function handleTouchEnd() {
  leftPressed = false;
  rightPressed = false;
}

function setupButtonControls() {
  leftButton.addEventListener('touchstart', (e) => { e.preventDefault(); leftPressed = true; });
  leftButton.addEventListener('touchend', (e) => { e.preventDefault(); leftPressed = false; });
  leftButton.addEventListener('mousedown', () => { leftPressed = true; });
  leftButton.addEventListener('mouseup', () => { leftPressed = false; });
  leftButton.addEventListener('mouseleave', () => { leftPressed = false; });
  
  rightButton.addEventListener('touchstart', (e) => { e.preventDefault(); rightPressed = true; });
  rightButton.addEventListener('touchend', (e) => { e.preventDefault(); rightPressed = false; });
  rightButton.addEventListener('mousedown', () => { rightPressed = true; });
  rightButton.addEventListener('mouseup', () => { rightPressed = false; });
  rightButton.addEventListener('mouseleave', () => { rightPressed = false; });
}

function setupStartButtonListeners() {
  startButton.addEventListener('click', initializeGame);
  startButton.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initializeGame();
  });
}

function setupTouchControls() {
  document.addEventListener('touchstart', handleTouchStart);
  document.addEventListener('touchend', handleTouchEnd);
}

function setupKeyboardControls() {
  window.addEventListener('keydown', (e) => {
    keysPressed[e.code] = true;
    
    if (!gameStarted) return;
    
    if (e.code === 'KeyR') {
      if (isGameOver) {
        location.reload();
      } else {
        resetGameState();
      }
    } else if (e.code === 'Space') {
      shootBullet();
    }
  });
  
  window.addEventListener('keyup', (e) => {
    keysPressed[e.code] = false;
  });
}

function setupCanvasClickControls() {
  canvasElement.addEventListener('click', (e) => {
    if (!isGameOver) return;
    const coords = getCanvasCoordinates(e.clientX, e.clientY);
    if (isOnRestartButton(coords.x, coords.y)) location.reload();
  });
  
  canvasElement.addEventListener('touchend', (e) => {
    if (!isGameOver) return;
    const touch = e.changedTouches[0];
    const coords = getCanvasCoordinates(touch.clientX, touch.clientY);
    if (isOnRestartButton(coords.x, coords.y)) location.reload();
  });
}

// ===== 9. MAIN GAME LOOP =====
function gameLoop(timestamp) {
  if (gameStarted) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const deltaTime = timestamp - lastTimestamp;
    lastTimestamp = timestamp;
    updateGameLogic(deltaTime);
  }
  
  renderFrame();
  requestAnimationFrame(gameLoop);
}

// Initialize controls and start loop
setupStartButtonListeners();
setupButtonControls();
setupTouchControls();
setupKeyboardControls();
setupCanvasClickControls();
resetGameState();
requestAnimationFrame(gameLoop);
</script>
